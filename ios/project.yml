name: KaspaLiveWidget
options:
  bundleIdPrefix: xyz.geekprotocol
  deploymentTarget:
    iOS: "17.0"
packages:
  KaspaCore:
    path: KaspaCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  KaspaLiveWidget:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.geekprotocol.kaspawidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kaspa Widget
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: xyz.geekprotocol.kaspawidget
            CFBundleURLSchemes: [kaspawidget]
    entitlements:
      path: App/KaspaLiveWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.xyz.geekprotocol.kaspawidget]
    dependencies:
      - package: KaspaCore
      - target: KaspaHomeWidget
        embed: true
  KaspaHomeWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: Assets.xcassets
        excludes: [AppIcon.appiconset]
      - PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.geekprotocol.kaspawidget.home
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Kaspa Live Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/KaspaHomeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.xyz.geekprotocol.kaspawidget]
    dependencies:
      - package: KaspaCore
  KaspaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.geekprotocol.kaspawidget.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KaspaLiveWidget
schemes:
  KaspaLiveWidget:
    build:
      targets:
        KaspaLiveWidget: all
    test:
      targets: [KaspaUITests]
