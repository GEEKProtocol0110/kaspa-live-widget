name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 9477386
        
    - name: Configure Android SDK
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build release APK
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
    - name: Rename APK
      run: |
        mkdir -p release
        find app/build/outputs/apk/release -name "*.apk" -exec cp {} release/kaspa-widget-${{ steps.version.outputs.VERSION }}.apk \;
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## Kaspa Live Widget ${{ steps.version.outputs.VERSION }}
          
          ### Installation
          1. Download `kaspa-widget-${{ steps.version.outputs.VERSION }}.apk`
          2. Enable "Unknown Sources" in Android settings
          3. Install the APK
          4. Add widget to your home screen
          
          ### What's Changed
          See release notes below for details.
          
          ### Requirements
          - Android 8.0 (API 26) or higher
          - Internet connection
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
