name: Signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag matching the current main app version'
        required: true
        default: 'v1.4.1'
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WIDGET_STORE_PASSWORD: ${{ secrets.WIDGET_STORE_PASSWORD }}
      WIDGET_KEY_ALIAS: ${{ secrets.WIDGET_KEY_ALIAS }}
      WIDGET_KEY_PASSWORD: ${{ secrets.WIDGET_KEY_PASSWORD }}
      WIDGET_SIGNING_CERT_SHA256: ${{ secrets.WIDGET_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os, re
          text = open('app/build.gradle.kts').read()
          version = re.search(r'versionName = "([0-9]+\.[0-9]+\.[0-9]+)"', text).group(1)
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match the app version'
          PY
      - name: Restore persistent signing key
        env:
          WIDGET_KEYSTORE_BASE64: ${{ secrets.WIDGET_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in WIDGET_KEYSTORE_BASE64 WIDGET_STORE_PASSWORD WIDGET_KEY_ALIAS WIDGET_KEY_PASSWORD WIDGET_SIGNING_CERT_SHA256; do
            if [ -z "${!name}" ]; then echo "::error::Missing signing configuration: $name. See SIGNED_RELEASES.md."; exit 1; fi
          done
          umask 077
          printf '%s' "$WIDGET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/widget-release.jks"
          echo "WIDGET_KEYSTORE_PATH=$RUNNER_TEMP/widget-release.jks" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
      - name: Test and build signed APK and Play bundle
        run: ./gradlew build bundleRelease --no-daemon
      - name: Verify signature and update compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          signer="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          cert() { "$signer" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]'; }
          expected=$(printf '%s' "$WIDGET_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$(cert "$apk")" = "$expected"
          # A failed network request must not masquerade as a first release.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          previous=$(python3 -c 'import json,sys; print(next((r["tag_name"] for r in json.load(open(sys.argv[1])) if not r["draft"] and not r["prerelease"] and any(a["name"]=="kaspa-live-widget.apk" for a in r["assets"])), ""))' "$RUNNER_TEMP/releases.json")
          if [ -n "$previous" ]; then
            mkdir "$RUNNER_TEMP/previous"
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern kaspa-live-widget.apk --dir "$RUNNER_TEMP/previous"
            old="$RUNNER_TEMP/previous/kaspa-live-widget.apk"
            test "$(cert "$old")" = "$expected"
            old_code=$("$aapt" dump badging "$old" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p")
            new_code=$("$aapt" dump badging "$apk" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p")
            test "$new_code" -gt "$old_code"
          fi
          mkdir release
          cp "$apk" release/kaspa-live-widget.apk
          bundle=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)
          jarsigner -verify "$bundle" > "$RUNNER_TEMP/bundle-verification.txt"
          grep -q "jar verified" "$RUNNER_TEMP/bundle-verification.txt"
          if grep -qi "unsigned entries" "$RUNNER_TEMP/bundle-verification.txt"; then echo "::error::Unsigned bundle entries"; exit 1; fi
          # Both delivery formats must be signed with the same backed-up identity.
          keytool -printcert -jarfile "$bundle" > "$RUNNER_TEMP/bundle-cert.txt"
          bundle_cert=$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/bundle-cert.txt" | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$bundle_cert" = "$expected"
          cp "$bundle" release/kaspa-live-widget.aab
          python3 - <<'PY'
          import zipfile
          for path in ['release/kaspa-live-widget.apk', 'release/kaspa-live-widget.aab']:
              with zipfile.ZipFile(path) as artifact:
                  assert not any(n.endswith('.so') for n in artifact.namelist()), 'Review native library 16 KB compatibility before publishing'
          PY
          (cd release && sha256sum kaspa-live-widget.apk kaspa-live-widget.aab > SHA256SUMS)
      - name: Publish permanent download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual release is built from main, with tag creation only after verification.
            git rev-parse HEAD > "$RUNNER_TEMP/release-head.txt"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$(cat "$RUNNER_TEMP/release-head.txt")"
          fi
          gh release create "$RELEASE_TAG" release/kaspa-live-widget.apk release/kaspa-live-widget.aab release/SHA256SUMS --verify-tag --generate-notes --title "Kaspa Live Widget $RELEASE_TAG" --notes "Install kaspa-live-widget.apk on Android 8+. kaspa-live-widget.aab is the signed Google Play upload bundle targeting Android 16 (API 36). Future signed releases update this app while keeping settings and widgets. Permanent URL: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/kaspa-live-widget.apk"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/widget-release.jks"

  screenshots:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Download signed update and previous public APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p current previous
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern kaspa-live-widget.apk --dir current
          gh release download v1.3.0 --repo "$GITHUB_REPOSITORY" --pattern kaspa-live-widget.apk --dir previous
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check signed update and capture real Android 16 screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install previous/kaspa-live-widget.apk
            adb install -r current/kaspa-live-widget.apk
            python3 play-store/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-phone-screenshots
          path: store-screenshots/*.png
          retention-days: 90
      - name: Attach store screenshots to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" store-screenshots/*.png --repo "$GITHUB_REPOSITORY" --clobber
