name: iPhone app and widgets
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: xcodebuild -version && swift --version
      - name: Core regression tests
        run: swift test --package-path ios/KaspaCore
      - name: Generate native Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build app and embedded widget for iPhone Simulator
        run: xcodebuild -project ios/KaspaLiveWidget.xcodeproj -scheme KaspaLiveWidget -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Exercise app on available iPhone Simulator
        run: |
          python3 ios/scripts/simulator-proof.py
      - name: Package simulator app
        if: success()
        run: ditto -c -k --keepParent ios/build/Build/Products/Debug-iphonesimulator/KaspaLiveWidget.app ios/KaspaLiveWidget-simulator.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-build-evidence
          path: |
            ios/evidence/
            ios/KaspaLiveWidget-simulator.zip
          retention-days: 30
