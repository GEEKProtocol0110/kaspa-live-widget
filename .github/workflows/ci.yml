name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
    
    - name: Configure Android SDK
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build --stacktrace
      
    - name: Run tests
      run: ./gradlew test --stacktrace

    - name: Upload regression reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: app/build/test-results/
        retention-days: 7
      
    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

  layout:
    name: Android ${{ matrix.api }} preview layouts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: layout-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check actual narrow and wide previews at both text scales
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            python3 play-store/layout-proof.py
            python3 play-store/theme-proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-api-${{ matrix.api }}
          path: layout-evidence/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-api-${{ matrix.api }}
          path: theme-evidence/
          retention-days: 30
